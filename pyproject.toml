[project]
name = "star-chain"
version = "0.2.0"
description = "Multi-agent collaboration channel layer — Feishu IM ↔ OpenAI Agents SDK ↔ Tool Layer"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.1.0",
    "openai>=1.0.0",
    "lark-oapi>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"star_chain" = ["py.typed"]
